services:
  - type: web
    name: matchlab-analytics
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: SERVE_CLIENT
        value: "true"
      - key: DATA_STORE_PATH
        value: /var/data/matchlab-store.json
      - key: CLIENT_ORIGIN
        value: ""
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
    disk:
      name: matchlab-data
      mountPath: /var/data
      sizeGB: 1
